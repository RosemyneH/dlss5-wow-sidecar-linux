[workspace]
resolver = "2"
members = [
    "crates/sidecar-config",
    "crates/sidecar-core",
    "crates/sidecar-cli",
    "crates/sidecar-install",
    "crates/sidecar-neural",
    "crates/sidecar-probes",
    "crates/sidecar-runtime",
    "crates/sidecar-overlay",
    "crates/sidecar-capture",
    "crates/wowsidecar-manager",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/xilla420/dlss5-wow-sidecar"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
