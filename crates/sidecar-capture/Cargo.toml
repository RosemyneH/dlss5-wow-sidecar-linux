[package]
name = "sidecar-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PipeWire / xdg-desktop-portal window capture for Wayland (Hyprland)"

[dependencies]
anyhow.workspace = true
ashpd = { version = "0.13", default-features = false, features = ["screencast", "tokio", "backend"] }
pipewire = "0.10"
sidecar-core = { path = "../sidecar-core" }
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
