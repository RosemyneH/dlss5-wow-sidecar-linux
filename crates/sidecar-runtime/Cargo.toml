[package]
name = "sidecar-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Overlay daemon, manager IPC, hotkeys, and runtime status (Linux)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wowsidecar-daemon"
path = "src/bin/wowsidecar-daemon.rs"

[features]
default = ["hotkeys-evdev"]
hotkeys-evdev = ["dep:evdev"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
evdev = { version = "0.13", optional = true }
sidecar-capture = { path = "../sidecar-capture" }
sidecar-config = { path = "../sidecar-config" }
sidecar-core = { path = "../sidecar-core" }
sidecar-neural = { path = "../sidecar-neural" }
sidecar-overlay = { path = "../sidecar-overlay" }
sidecar-probes = { path = "../sidecar-probes" }

[dev-dependencies]
tempfile = "3"
sidecar-capture = { path = "../sidecar-capture" }
