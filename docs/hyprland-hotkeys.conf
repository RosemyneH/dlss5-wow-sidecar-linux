# WoW sidecar — Hyprland binds (no evdev/portal required)
# Match keys to [hotkeys] in sidecar.toml (defaults below).

$wowsidecar = wowsidecar-linux

bind = CTRL ALT, D, exec, $wowsidecar send toggle-overlay
bind = CTRL ALT, H, exec, $wowsidecar send toggle-hud
bind = CTRL ALT, S, exec, $wowsidecar send stop
bind = CTRL ALT, BACKSPACE, exec, $wowsidecar send panic
